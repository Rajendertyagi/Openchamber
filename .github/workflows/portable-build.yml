name: Portable Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows Portable x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      APP_NAME: OpenChamber
      ARCH: x64
      PLATFORM: win
      BUN_VERSION: "2.4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            ~/.cache/bun
          key: bun-${{ runner.os }}-v${{ env.BUN_VERSION }}
          restore-keys: |
            bun-${{ runner.os }}-v

      - name: Setup Bun (force 2.4.0)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version
        shell: bash
        run: |
          echo "bun --version:"
          bun --version

      - name: Cache npm (used by Bun for some registries)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pip/wheels
          key: python-pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            python-pip-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build web UI
        working-directory: packages/electron
        run: bun run build:web-assets
        shell: bash

      - name: Prepare OpenCode CLI
        working-directory: packages/electron
        run: bun run prepare:opencode-cli && bun run verify:opencode-cli
        shell: bash

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main
        shell: bash

      - name: Rebuild native modules
        working-directory: packages/electron
        run: bun run rebuild:native
        shell: bash

      - name: Package portable build
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --dir --${{ env.PLATFORM }} --${{ env.ARCH }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Force close running build binaries
        shell: pwsh
        run: |
          Stop-Process -Name "OpenChamber" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "opencode" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Rename build output
        shell: bash
        run: |
          SRC="packages/electron/dist/${{ env.PLATFORM }}-unpacked"
          DST="packages/electron/dist/${{ env.APP_NAME }}"

          if [ ! -d "$SRC" ]; then
            echo "⚠ Expected build directory not found: $SRC"
            echo "Contents of packages/electron/dist:"
            ls -la packages/electron/dist || true
            exit 1
          fi

          rm -rf "$DST"

          for attempt in 1 2 3 4 5; do
            if mv "$SRC" "$DST" 2>/tmp/mv-error.log; then
              echo "✓ Build output renamed successfully (attempt $attempt)"
              exit 0
            fi
            echo "⚠ mv failed (attempt $attempt):"
            cat /tmp/mv-error.log || true
            echo "Retrying in 5s (Windows file locks can take a moment to release)..."
            sleep 5
          done

          echo "✗ Failed to rename build output after 5 attempts"
          echo "Contents of packages/electron/dist:"
          ls -la packages/electron/dist || true
          exit 1

      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          $buildDir = "packages/electron/dist/${{ env.APP_NAME }}"
          if (-not (Test-Path $buildDir)) {
            Write-Error "Build directory not found: $buildDir"
            exit 1
          }
          Write-Output "✓ Build artifacts verified at: $buildDir"

      - name: Log build info
        shell: bash
        run: |
          echo "Build Summary:"
          echo "  Platform: ${{ env.PLATFORM }}"
          echo "  Architecture: ${{ env.ARCH }}"
          echo "  App Name: ${{ env.APP_NAME }}"
          ls -lh "packages/electron/dist/${{ env.APP_NAME }}" || echo "⚠ Build directory not found"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-portable-${{ env.PLATFORM }}-${{ env.ARCH }}
          path: packages/electron/dist/${{ env.APP_NAME }}
          retention-days: 7
          if-no-files-found: error

      - name: Clean up temporary build files
        if: always()
        shell: bash
        run: |
          rm -rf "packages/electron/dist/${{ env.APP_NAME }}" || true
          echo "✓ Temporary files cleaned up"
