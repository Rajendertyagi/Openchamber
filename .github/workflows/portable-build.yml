name: Portable Build

on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a running run when you re-trigger, so builds don't stack up
concurrency:
  group: portable-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-portable:
    name: Build Windows Portable x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      APP_NAME: OpenChamber
      ARCH: x64
      PLATFORM: win
      BUN_VERSION: "1.4.3"
      # Pin electron/electron-builder download caches to workspace paths
      # (per electron-builder docs: must be absolute; workspace-relative is
      # what makes actions/cache save/restore them deterministically).
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun (pin 1.4.3)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install store
        id: cache-bun
        uses: actions/cache@v4
        with:
          # Bun's global package store: %USERPROFILE%\.bun\install\cache on Windows
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Cache Electron + electron-builder toolsets
        id: cache-electron
        uses: actions/cache@v4
        with:
          # Populated via ELECTRON_CACHE / ELECTRON_BUILDER_CACHE env vars above.
          # Covers the Electron zip AND NSIS/winCodeSign/7zip toolsets.
          path: |
            .cache/electron
            .cache/electron-builder
          key: eb-${{ runner.os }}-${{ hashFiles('packages/electron/package.json') }}

      - name: Verify Bun version
        shell: bash
        run: |
          echo "bun --version:"
          bun --version

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Cache native prebuilds
        id: cache-native
        uses: actions/cache@v4
        with:
          # Restored AFTER install (on top of fresh node_modules).
          # Exact key only — no restore-keys — so an Electron upgrade can
          # never restore prebuilds compiled for an older ABI.
          path: |
            node_modules/node-pty/build
            node_modules/bun-pty/build
          key: native-${{ runner.os }}-${{ hashFiles('packages/electron/package.json') }}

      - name: Build & prepare (parallel)
        working-directory: packages/electron
        shell: bash
        run: |
          bun run build:web-assets & pid_web=$!
          (bun run prepare:opencode-cli && bun run verify:opencode-cli) & pid_cli=$!
          bun run prepare:ripgrep & pid_rg=$!
          bun run bundle:main & pid_bundle=$!

          wait $pid_web; s_web=$?
          wait $pid_cli; s_cli=$?
          wait $pid_rg; s_rg=$?
          wait $pid_bundle; s_bundle=$?
          echo "Parallel tasks: web=$s_web cli=$s_cli ripgrep=$s_rg bundle=$s_bundle"
          [ $((s_web + s_cli + s_rg + s_bundle)) -eq 0 ] || exit 1

      - name: Rebuild native modules (skip on prebuild cache hit)
        if: steps.cache-native.outputs.cache-hit != 'true'
        working-directory: packages/electron
        shell: bash
        run: bun run rebuild:native

      - name: Package portable build
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --dir --${{ env.PLATFORM }} --${{ env.ARCH }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Force close running build binaries
        shell: pwsh
        run: |
          Stop-Process -Name "OpenChamber" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "opencode" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Rename build output
        shell: bash
        run: |
          SRC="packages/electron/dist/${{ env.PLATFORM }}-unpacked"
          DST="packages/electron/dist/${{ env.APP_NAME }}"
          if [ ! -d "$SRC" ]; then
            echo "⚠ Expected build directory not found: $SRC"
            echo "Contents of packages/electron/dist:"
            ls -la packages/electron/dist || true
            exit 1
          fi
          rm -rf "$DST"
          for attempt in 1 2 3 4 5; do
            if mv "$SRC" "$DST" 2>/tmp/mv-error.log; then
              echo "✓ Build output renamed successfully (attempt $attempt)"
              exit 0
            fi
            echo "⚠ mv failed (attempt $attempt):"
            cat /tmp/mv-error.log || true
            echo "Retrying in 5s (Windows file locks can take a moment to release)..."
            sleep 5
          done
          echo "✗ Failed to rename build output after 5 attempts"
          echo "Contents of packages/electron/dist:"
          ls -la packages/electron/dist || true
          exit 1

      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          $buildDir = "packages/electron/dist/${{ env.APP_NAME }}"
          if (-not (Test-Path $buildDir)) {
            Write-Error "Build directory not found: $buildDir"
            exit 1
          }
          Write-Output "✓ Build artifacts verified at: $buildDir"

      - name: Log build info
        shell: bash
        run: |
          echo "Build Summary:"
          echo " Platform: ${{ env.PLATFORM }}"
          echo " Architecture: ${{ env.ARCH }}"
          echo " App Name: ${{ env.APP_NAME }}"
          ls -lh "packages/electron/dist/${{ env.APP_NAME }}" || echo "⚠ Build directory not found"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-portable-${{ env.PLATFORM }}-${{ env.ARCH }}
          path: packages/electron/dist/${{ env.APP_NAME }}
          retention-days: 3
          if-no-files-found: error

      - name: Clean up temporary build files
        if: always()
        shell: bash
        run: |
          rm -rf "packages/electron/dist/${{ env.APP_NAME }}" || true
          echo "✓ Temporary files cleaned up"
