name: Portable Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows Portable x64
    runs-on: windows-2022
    env:
      APP_NAME: OpenChamber
      ARCH: x64
      PLATFORM: win
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Prefer pinning to the version in package.json; change if you intentionally want latest
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Show runtime versions
        shell: bash
        run: |
          node -v
          bun -v
          npm -v

      - name: Restore caches (if any)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            **/node_modules
            packages/electron/.cache/opencode-cli
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-
            ${{ runner.os }}-

      - name: Install dependencies (skip package scripts)
        shell: bash
        run: |
          # Install dependencies but do not run package postinstall hooks yet.
          # This prevents Bun from executing the repo postinstall automatically.
          bun install --frozen-lockfile --ignore-scripts

      - name: Remove Bun symlink cache (prevent Node EPERM)
        shell: bash
        run: |
          if [ -d node_modules/.bun ]; then
            echo "Removing node_modules/.bun to avoid EPERM on Windows"
            rm -rf node_modules/.bun
          else
            echo "No node_modules/.bun present"
          fi

      - name: Run postinstall fixes and apply patches (safe order)
        shell: bash
        run: |
          set -euo pipefail

          # detect script path
          if [ -f ./fix-deprecation.js ]; then
            SCRIPT=./fix-deprecation.js
          elif [ -f ./scripts/fix-deprecation.js ]; then
            SCRIPT=./scripts/fix-deprecation.js
          else
            echo "ERROR: fix-deprecation.js not found at ./fix-deprecation.js or ./scripts/fix-deprecation.js" >&2
            exit 1
          fi
          echo "Detected postinstall script: $SCRIPT"

          # Run the script with bun if available (bun avoids Node's realpath into .bun)
          if command -v bun >/dev/null 2>&1; then
            echo "Running postinstall script with bun"
            bun "$SCRIPT"
          else
            echo "Running postinstall script with node"
            node "$SCRIPT"
          fi

          # Apply patch-package non-interactively; prefer bunx/bun if available
          if command -v bunx >/dev/null 2>&1; then
            echo "Applying patch-package with bunx"
            bunx patch-package
          elif command -v bun >/dev/null 2>&1; then
            echo "Applying patch-package with bun (fallback to npx if needed)"
            bun run patch-package || npx --yes patch-package
          else
            echo "Applying patch-package with npx"
            npx --yes patch-package
          fi

      - name: Ensure no Bun symlink cache remains (pre-build safety)
        shell: bash
        run: |
          if [ -d node_modules/.bun ]; then
            echo "Removing leftover node_modules/.bun"
            rm -rf node_modules/.bun
          fi

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache packaged OpenCode CLI
        uses: actions/cache@v4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-x64-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-x64-
            opencode-cli-${{ runner.os }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets
        shell: bash

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main
        shell: bash

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        run: |
          # safety: remove any .bun in repo root before invoking node-based rebuild
          if [ -d ../../node_modules/.bun ]; then
            rm -rf ../../node_modules/.bun || true
          fi
          node ./scripts/rebuild-native.mjs

      - name: Build portable app (unpacked dir)
        working-directory: packages/electron
        shell: bash
        run: |
          # safety: ensure no .bun before packaging
          if [ -d ../../node_modules/.bun ]; then
            rm -rf ../../node_modules/.bun || true
          fi
          node ./scripts/package.mjs --dir --${{ env.PLATFORM }} --${{ env.ARCH }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Zip portable build
        shell: pwsh
        run: |
          $src = "packages/electron/dist/${{ env.PLATFORM }}-unpacked"
          $dest = "${{ env.APP_NAME }}-portable-${{ env.PLATFORM }}-${{ env.ARCH }}.zip"
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path $src -DestinationPath $dest
          Write-Output "Artifact created: $dest"

      - name: Upload portable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-portable-${{ env.PLATFORM }}-${{ env.ARCH }}
          path: ${{ env.APP_NAME }}-portable-${{ env.PLATFORM }}-${{ env.ARCH }}.zip
          retention-days: 7
